<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Hermes Mythos — Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
  h1 { color: #58a6ff; margin-bottom: 20px; font-size: 1.5em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  .card .label { font-size: 0.85em; color: #8b949e; margin-bottom: 8px; }
  .card .value { font-size: 2em; font-weight: 700; }
  .card.ok .value { color: #3fb950; }
  .card.warn .value { color: #d29922; }
  .card.error .value { color: #f85149; }
  .status-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75em; }
  .status-badge.up { background: #238636; color: #fff; }
  .status-badge.down { background: #da3633; color: #fff; }
  .errors { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  .errors h3 { color: #f85149; margin-bottom: 12px; }
  .error-item { padding: 8px 0; border-bottom: 1px solid #21262d; font-family: monospace; font-size: 0.85em; color: #8b949e; }
  .error-item:last-child { border-bottom: none; }
  .updated { text-align: center; color: #484f58; font-size: 0.8em; margin-top: 20px; }
  .skills-state { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .skill-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75em; background: #21262d; }
  .skill-badge.active { background: #238636; }
  .skill-badge.stale { background: #9e6a03; }
  .skill-badge.archived { background: #6e7681; }
</style>
</head>
<body>
<h1>🏛️ Hermes Mythos — Monitor</h1>

<div class="grid">
  <div class="card ok">
    <div class="label">WhatsApp</div>
    <div class="value"><span id="wa-status" class="status-badge">?</span></div>
  </div>
  <div class="card">
    <div class="label">Tasks processadas</div>
    <div class="value" id="task-total">0</div>
  </div>
  <div class="card">
    <div class="label">Custo total (USD)</div>
    <div class="value" id="cost-total">$0.0000</div>
  </div>
  <div class="card">
    <div class="label">Tasks ativas</div>
    <div class="value" id="tasks-active">0</div>
  </div>
  <div class="card">
    <div class="label">Background reviews</div>
    <div class="value" id="reviews-total">0</div>
  </div>
</div>

<div class="grid">
  <div class="card warn">
    <div class="label">Tasks custo &gt;$0.50</div>
    <div class="value" id="high-cost">0</div>
  </div>
  <div class="card warn">
    <div class="label">Tasks &gt;5min</div>
    <div class="value" id="long-tasks">0</div>
  </div>
</div>

<div class="errors">
  <h3>🪝 Hooks ativos</h3>
  <div id="hooks-list">carregando…</div>
</div>

<div class="updated">Atualizado: <span id="updated-at">—</span></div>

<script>
async function load() {
  try {
    const [metrics, hooks] = await Promise.all([
      fetch('/api/metrics').then(r => r.json()).catch(() => ({})),
      fetch('/api/hooks').then(r => r.json()).catch(() => []),
    ]);

    document.getElementById('wa-status').textContent = metrics.whatsappUp ? '✅ online' : '❌ offline';
    document.getElementById('wa-status').className = 'status-badge ' + (metrics.whatsappUp ? 'up' : 'down');
    document.getElementById('task-total').textContent = metrics.tasks || 0;
    document.getElementById('cost-total').textContent = '$' + (metrics.costUSD || 0).toFixed(4);
    document.getElementById('tasks-active').textContent = metrics.tasksActive || 0;
    document.getElementById('reviews-total').textContent = metrics.reviews || 0;
    document.getElementById('high-cost').textContent = metrics.highCostTasks || 0;
    document.getElementById('long-tasks').textContent = metrics.longTasks || 0;
    document.getElementById('hooks-list').innerHTML = hooks.length === 0
      ? 'nenhum hook ativo'
      : hooks.map(h => `<div class="error-item">${h.file} — ${h.events?.join(', ') || '?'}</div>`).join('');
    document.getElementById('updated-at').textContent = new Date().toLocaleTimeString('pt-BR');
  } catch (e) {
    document.getElementById('updated-at').textContent = 'erro: ' + e.message;
  }
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
