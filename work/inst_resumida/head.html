<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Programa de Parcerias · Lucro Ativo</title>
<style>
  :root{
    --navy:#010860; --navy2:#0a1180; --navy3:#39406e; --gold:#C9A227; --ink:#1a1f36;
    --grey:#5a6072; --line:#e3e6ef; --bg:#f7f8fc;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:1280px 720px;margin:0}
  body{font-family:'Inter',sans-serif;color:var(--ink)}
  .slide{width:1280px;height:720px;position:relative;overflow:hidden;page-break-after:always;background:#fff;display:flex;flex-direction:column}
  h1,h2,h3,h4,.mont{font-family:'Montserrat',sans-serif}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:34px 64px 0 64px}
  .tag{font-family:'Montserrat',sans-serif;font-weight:700;font-size:19px;letter-spacing:.14em;color:var(--navy);text-transform:uppercase}
  .tag .n{color:var(--gold);margin-right:10px}
  .rule{height:3px;background:linear-gradient(90deg,var(--navy) 0 70%,var(--gold) 70% 100%);margin:14px 64px 0 64px}
  .content{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 64px 56px 64px}
  .foot{position:absolute;bottom:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 64px;font-size:15px;color:var(--grey);background:#fff;z-index:3}
  .foot .brand{font-family:'Montserrat',sans-serif;font-weight:600;color:var(--navy)}
  h2.title{font-size:44px;color:var(--navy);font-weight:800;line-height:1.12;margin-bottom:8px}
  .sub{font-size:23px;color:var(--grey);margin-bottom:22px}
  .ghost{position:absolute;right:24px;bottom:-40px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:340px;color:var(--navy);opacity:.045;line-height:1;z-index:0}
  .z{position:relative;z-index:1}

  /* navy slides */
  .navy{background:linear-gradient(160deg,var(--navy) 0%,#030a72 55%,#0a1288 100%);color:#fff}
  .stripe{position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--gold)}
  .cover{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 96px;position:relative;z-index:2}
  .cover img.la{width:360px;margin-bottom:44px}
  .kicker{font-family:'Montserrat',sans-serif;font-weight:700;font-size:19px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin-bottom:20px}
  .cover h1{font-size:62px;font-weight:800;line-height:1.1;max-width:980px}
  .cover .sub2{font-size:27px;color:#c8cdf0;margin-top:24px;max-width:840px;line-height:1.45}
  .cover .meta{display:flex;gap:34px;margin-top:46px;font-size:19px;color:#aab1e8;flex-wrap:wrap}
  .cover .meta b{color:#fff;font-weight:600}
  .coverart{position:absolute;right:76px;bottom:70px;z-index:1}

  /* índice */
  .idx{display:grid;grid-template-columns:1fr 1fr;gap:18px 40px;margin-top:6px}
  .idx .it{display:flex;align-items:center;gap:22px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:20px 24px}
  .idx .num{font-family:'Montserrat',sans-serif;font-weight:800;font-size:44px;color:var(--navy);min-width:70px}
  .idx .d{font-size:22px;font-weight:600;color:var(--ink);line-height:1.3}
  .idx .d span{display:block;font-size:17px;font-weight:400;color:var(--grey);margin-top:2px}

  /* cards / grids */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{background:var(--bg);border:1px solid var(--line);border-left:6px solid var(--navy);border-radius:10px;padding:24px 26px}
  .card h3{font-size:24px;color:var(--navy);font-weight:700;margin-bottom:8px}
  .card p,.card li{font-size:19.5px;line-height:1.45;color:var(--ink)}
  .card.gold{border-left-color:var(--gold)}
  .mb{width:42px;height:6px;background:var(--gold);border-radius:3px;margin-bottom:14px}
  ul.clean{list-style:none}
  ul.clean li{padding-left:26px;position:relative;margin-bottom:9px}
  ul.clean li::before{content:"";position:absolute;left:0;top:10px;width:12px;height:12px;background:var(--gold);border-radius:2px}
  ul.clean li b{color:var(--navy)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:8px}
  .stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:8px}
  .stat{background:var(--navy);color:#fff;border-radius:12px;padding:26px 20px;text-align:center}
  .stat .v{font-family:'Montserrat',sans-serif;font-weight:800;font-size:48px;color:var(--gold);line-height:1.1}
  .stat .l{font-size:17px;color:#c8cdf0;margin-top:8px;line-height:1.35}
  .stat.soft{background:var(--bg);border:1px solid var(--line)}
  .stat.soft .v{color:var(--navy)}
  .stat.soft .l{color:var(--grey)}

  .journey{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:10px}
  .step{background:var(--bg);border:1px solid var(--line);border-top:6px solid var(--navy);border-radius:10px;padding:20px 14px;text-align:center}
  .step.hot{border-top-color:var(--gold);background:#fdf9ee}
  .step .n{font-family:'Montserrat',sans-serif;font-weight:800;font-size:38px;color:var(--navy)}
  .step h4{font-family:'Montserrat',sans-serif;font-size:19px;color:var(--navy);margin:8px 0 8px 0;line-height:1.2}
  .step p{font-size:15.5px;color:var(--grey);line-height:1.35}

  table{width:100%;border-collapse:collapse;background:#fff}
  th{background:var(--navy);color:#fff;font-family:'Montserrat',sans-serif;font-size:18px;font-weight:600;padding:14px 18px;text-align:left}
  td{font-size:20px;padding:16px 18px;border-bottom:1px solid var(--line);line-height:1.35}
  tr:nth-child(even) td{background:var(--bg)}
  td b{color:var(--navy)}
  .pill{display:inline-block;background:var(--gold);color:#fff;font-family:'Montserrat',sans-serif;font-weight:700;font-size:14.5px;border-radius:20px;padding:4px 14px;letter-spacing:.04em}
  .pill.navy{background:var(--navy)}
  .pill.soft{background:#e7e9f7;color:var(--navy)}

  .note{margin-top:16px;background:#fdf9ee;border:1px solid #ecd9a0;border-radius:10px;padding:13px 20px;font-size:18px;color:#6b5510}
  .note b{color:#8a6d0d}
  .legal{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .legal .lx{background:#fff;border:1px solid var(--line);border-top:6px solid var(--gold);border-radius:10px;padding:16px 20px}
  .legal .lx h4{font-family:'Montserrat',sans-serif;font-size:18.5px;color:var(--navy);margin-bottom:6px;line-height:1.25}
  .legal .lx p{font-size:16px;color:var(--grey);line-height:1.4}

  /* chevron flow */
  .flow{display:flex;margin-top:16px;filter:drop-shadow(0 2px 5px rgba(1,8,96,.14))}
  .fs{flex:1;position:relative;display:flex;flex-direction:column;justify-content:center;min-height:128px;padding:18px 36px 18px 46px;background:var(--navy);color:#fff;clip-path:polygon(0 0,calc(100% - 26px) 0,100% 50%,calc(100% - 26px) 100%,0 100%,26px 50%);margin-left:-14px}
  .fs:first-child{margin-left:0;padding-left:30px;clip-path:polygon(0 0,calc(100% - 26px) 0,100% 50%,calc(100% - 26px) 100%,0 100%)}
  .fs:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,26px 50%)}
  .fs .k{font-family:'Montserrat',sans-serif;font-weight:800;font-size:15px;letter-spacing:.14em;color:var(--gold);margin-bottom:6px}
  .fs h4{font-size:19.5px;line-height:1.2;margin-bottom:6px}
  .fs p{font-size:15px;color:#c8cdf0;line-height:1.35}
  .fs.hot{background:var(--gold)}
  .fs.hot .k{color:#fff}
  .fs.hot p{color:#fdf4d7}
  .flow.big .fs{min-height:190px;padding:26px 44px 26px 56px}
  .flow.big .fs:first-child{padding-left:34px}
  .flow.big .fs .k{font-size:17px}
  .flow.big .fs h4{font-size:26px;margin-bottom:10px}
  .flow.big .fs p{font-size:18px;line-height:1.4}
  .flow.sm .fs{min-height:96px;padding:12px 30px 12px 40px}
  .flow.sm .fs:first-child{padding-left:24px}
  .flow.sm .fs h4{font-size:16.5px;margin-bottom:4px}
  .flow.sm .fs p{font-size:13.5px}

  /* hub / rede */
  .hub{position:relative;margin-top:6px}
  .hub svg.wire{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  .hubc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:206px;height:206px;border-radius:50%;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;z-index:2;border:5px solid var(--gold);box-shadow:0 8px 26px rgba(1,8,96,.25)}
  .hubc b{font-family:'Montserrat',sans-serif;font-size:21px;line-height:1.15}
  .hubc span{font-size:13.5px;color:#c8cdf0;max-width:150px;line-height:1.3}
  .hn{position:absolute;width:292px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:10px;padding:14px 18px;z-index:2;box-shadow:0 2px 10px rgba(1,8,96,.07)}
  .hn h4{font-family:'Montserrat',sans-serif;font-size:19px;color:var(--navy);margin-bottom:4px}
  .hn p{font-size:15px;color:var(--grey);line-height:1.3}
  .hub.dark .hn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.25);border-left-color:var(--gold);box-shadow:none}
  .hub.dark .hn h4{color:#fff}
  .hub.dark .hn p{color:#c8cdf0}
  .hub.dark .hubc{background:rgba(255,255,255,.06);border-color:var(--gold);box-shadow:none}

  /* waterfall / barras */
  .wf{display:flex;align-items:flex-end;gap:26px;height:300px;margin-top:10px;padding:0 10px}
  .wf .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:10px}
  .wf .bar{width:100%;border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:12px}
  .wf .bar .bv{font-family:'Montserrat',sans-serif;font-weight:800;font-size:24px;color:#fff}
  .wf .stackt{width:100%;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center}
  .wf .stackt .bv{font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;color:#fff}
  .wf .stackb{width:100%;display:flex;align-items:flex-start;justify-content:center;padding-top:12px}
  .wf .cl{font-size:16.5px;color:var(--grey);text-align:center;line-height:1.3}
  .wf .cl b{color:var(--navy)}

  /* GS vertical slides */
  .cobrand{position:absolute;top:30px;right:64px;display:flex;align-items:center;gap:16px;z-index:4}
  .cobrand img{height:34px}
  .cobrand .sep{width:1px;height:30px;background:var(--line)}
  .gsnote{margin-top:18px;background:#eef0fa;border:1px solid #d5d9f0;border-radius:10px;padding:13px 20px;font-size:17px;color:#39406e}
  .gsnote b{color:var(--navy)}
  .deco{position:absolute;right:52px;bottom:64px;opacity:.08;z-index:0}

  .close .cover h1{font-size:56px}
</style>
